# ==============================================================================
# Fubika web — nginx COMPLETO (vai montado em /etc/nginx/nginx.conf)
# ==============================================================================
# Por que o arquivo inteiro e não só um server{} em conf.d/: o processo roda
# como uid 1000 (não-root), e o nginx.conf padrão da imagem tem três coisas que
# exigem privilégio e que um bloco em conf.d/ não consegue corrigir:
#   - 'user nginx;'            -> só funciona para root (vira aviso e é ignorada)
#   - 'pid /var/run/nginx.pid' -> /var/run não é escrevível pelo uid 1000
#   - temp paths em /var/cache/nginx
# Aqui não existe a diretiva 'user', o pid e os temp paths vão para /tmp e os
# logs vão para stdout/stderr — nada sobra que precise de privilégio.
#
# O conf.d/ NÃO é incluído de propósito: todo o server{} está neste arquivo.
# ==============================================================================

worker_processes auto;

pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    # Diretórios de escrita fora de /var, onde o uid 1000 não tem permissão.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        # 8080 e não 80: porta < 1024 exige privilégio e o processo é não-root.
        # O Caddy faz reverse_proxy web:8080 (WEB_PORT=8080 no compose).
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Os arquivos do Vite têm hash no nome, então podem ser cacheados para
        # sempre: uma build nova gera nomes novos.
        location /assets/ {
            try_files $uri =404;
            # Só add_header, sem a diretiva 'expires': as duas escrevem
            # Cache-Control e o cliente receberia o header duplicado.
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # O index.html NÃO pode ser cacheado: senão o navegador fica preso numa
        # versão antiga, pedindo hashes de assets que já não existem.
        # O try_files do bloco abaixo faz redirect interno para /index.html, que
        # volta a casar aqui — logo a rota de SPA também sai com no-cache.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # SPA: qualquer rota do react-router cai no index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }
}
